name: Weekly Encrypted Backup

on:
  schedule:
    # Every Saturday at 02:00 UTC (07:30 IST)
    - cron: '0 2 * * 6'
  workflow_dispatch:
    # Allows manual trigger for testing and ad-hoc backup drills

permissions:
  contents: read

concurrency:
  group: personal-ai-os-encrypted-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted Google Drive Backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies (age, jq, curl)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age jq curl coreutils

      - name: Run encrypted backup
        shell: bash
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          BACKUP_EXPORT_TOKEN: ${{ secrets.BACKUP_EXPORT_TOKEN }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          chmod +x .github/workflows/scripts/backup.sh
          ./.github/workflows/scripts/backup.sh

      - name: Report failure
        if: failure()
        shell: bash
        run: echo '::error::Encrypted backup failed. Review the sanitized workflow logs and resolve the reported stage.'
